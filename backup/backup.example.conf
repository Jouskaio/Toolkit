# Copy this file to backup.conf (it is ignored by git) and adapt it. Run: bash backup/backup.sh [backup.conf]

# Folders to save, separated by spaces (absolute paths)
SOURCES="/etc/nginx /var/www"

# Where the snapshots go: a local folder, or user@host:/folder over SSH
DEST="/srv/backups/myserver"

# How many snapshots to keep (the oldest ones are deleted)
KEEP=7

# Patterns that are not saved, separated by spaces
EXCLUDE="node_modules .cache *.log"

# The ssh command for a remote DEST, for example "ssh -i /home/me/.ssh/backup_key -p 2222"
RSYNC_SSH=""

# Extra rsync flags, simple words separated by spaces (for example --bwlimit=5000)
RSYNC_OPTIONS=""
